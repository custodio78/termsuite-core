services:
  termsuite-api:
    build: .
    container_name: termsuite-api
    ports:
      - "7000:8000"
    volumes:
      - ./data:/app/data
      - ./termsuite:/app/termsuite
      - ./treetagger:/app/treetagger
    environment:
      - TERMSUITE_JAR=/app/termsuite/termsuite-core-3.0.10.jar
      - TREETAGGER_HOME=/app/treetagger
      - DATA_DIR=/app/data
      - JAVA_OPTS=-Xms1g -Xmx4g
      # Ollama: IP/hostname del servidor donde corre Ollama
      # Por defecto: 192.168.0.88. Para otro host, define OLLAMA_HOST en .env
      - OLLAMA_HOST=${OLLAMA_HOST:-192.168.0.88}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      # Optimized Ollama Configuration
      - OLLAMA_BATCH_SIZE=15
      - OLLAMA_MAX_CONCURRENT=15
      - OLLAMA_TIMEOUT=90
      - OLLAMA_UNIFIED_TIMEOUT=120
      - OLLAMA_MAX_RETRIES=2
      - OLLAMA_UNIFIED_MODE=true
      - OLLAMA_MEMORY_CACHE_SIZE=2000
    restart: unless-stopped
