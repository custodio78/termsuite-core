plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'signing'
    id 'org.standardout.bnd-platform' version '1.7.0'
    id 'net.saliman.properties' version '1.5.2'
}

group = 'fr.univ-nantes.termsuite'
version = '3.1.0-SNAPSHOT'

sourceCompatibility = 17
targetCompatibility = 17

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

repositories {
    mavenLocal()
    mavenCentral()
}

sourceSets {
    eval
    corpora
}

// Javadoc configuration
javadoc {
    exclude '**/fr/univnantes/termsuite/types/**'
    options {
        failOnError = false
        encoding "UTF-8"
        docEncoding "UTF-8"
        charSet "UTF-8"
        addStringOption('Xdoclint:none', '-quiet')
    }
}

task javadocJar(type: Jar) {
    archiveClassifier = 'javadoc'
    from javadoc
}

task sourcesJar(type: Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

// JCASGEN
configurations {
    prepare.extendsFrom(implementation)
}

task jcasgen(type: JavaExec) {
    description = 'Generate UIMA TS classes'
    ext.srcFile = file("$projectDir/src/main/resources/TermSuite_TS.xml")
    ext.outputDir = file("$projectDir/src/main/java")
    inputs.file srcFile
    outputs.dir outputDir
    classpath configurations.prepare
    systemProperty 'uima.datapath', "$projectDir/desc"
    main = 'org.apache.uima.tools.jcasgen.Jg'
    args = ['-jcasgeninput', srcFile, '-jcasgenoutput', outputDir]
}

// forces jcasgen before java compiles
classes.dependsOn jcasgen

// UIMA type system is needed for Java compile
compileJava.source jcasgen.outputs, sourceSets.main.java

// OSGi / BND Platform
platform {
    fetchSources = false
    featureId = project.findProperty("termsuite.osgi.feature.id") ?: "termsuite.osgi.feature.id"
    featureName = project.findProperty("termsuite.osgi.feature.name") ?: "termsuite.osgi.feature.name"
    featureVersion = version
    
    // eclipseHome = new File(project.getProperty("user.eclipse.home")) // Commented out as it requires local setup
    
    bundle(project) {
        bnd {
            symbolicName = project.findProperty("osgi.plugin.symbolicName") ?: "fr.univnantes.termsuite"
            bundleName = project.findProperty("osgi.bundleName") ?: "TermSuite Core"
            version = project.version
            addQualifier = project.version.endsWith('SNAPSHOT')
            
            instruction "Import-Package", ""
            instruction "Export-Package", "fr.univnantes.termsuite.*,org.apache.uima.examples"
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact javadocJar
        }
    }
}

dependencies {
    // Test
    testImplementation "org.junit.jupiter:junit-jupiter:5.9.2"
    testImplementation "org.junit.vintage:junit-vintage-engine:5.9.2" // Support for JUnit 4 tests
    testImplementation "org.assertj:assertj-core:3.24.2"
    testImplementation "org.mockito:mockito-core:5.3.1"

    // Logging
    implementation "ch.qos.logback:logback-classic:1.4.7"

    // Json
    implementation "com.fasterxml.jackson.core:jackson-databind:2.15.0"
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.15.0"
    implementation "com.fasterxml.jackson.core:jackson-core:2.15.0"

    // Xodus
    implementation 'org.jetbrains.xodus:xodus-entity-store:1.3.232'
    
    // UIMA
    implementation "org.apache.uima:uimaj-core:2.10.2" // Keeping v2 as per plan
    implementation "org.apache.uima:uimafit-core:2.5.0"

    // Apache Common
    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "commons-cli:commons-cli:1.5.0"
    implementation "commons-io:commons-io:2.11.0"

    // Mate Tagger
    implementation "com.googlecode.mate-tools:anna:3.5"

    // Groovy
    implementation "org.codehaus.groovy:groovy:3.0.17"

    // Guava
    implementation "com.google.guava:guava:31.1-jre"
    
    // Guice
    implementation 'com.google.inject:guice:5.1.0'
    
    // Snake YAML
    implementation "org.yaml:snakeyaml:2.0"

    // UIMA Components (Assuming these are available or need to be kept as is)
    implementation 'fr.univ-nantes.julestar:uima-tree-tagger-wrapper:1.3'
    implementation 'fr.univ-nantes.julestar:uima-tokenizer:1.4'
    implementation 'fr.univ-nantes.julestar:uima-filter:1.2'
    implementation 'fr.univ-nantes.julestar:uima-mapper:1.2'
    implementation 'fr.univ-nantes.julestar:uima-chinese-segmenter:1.3'
    implementation 'fr.univ-nantes.julestar:uima-tokens-regex:1.4'
    implementation 'fr.univ-nantes.julestar:uima-stemmer:1.2'
    implementation 'fr.univ-nantes.julestar:uima-toolbox:1.0'
    
    // JCas type generation
    prepare "org.apache.uima:uimaj-tools:2.10.2"
}

test {
    useJUnitPlatform()
    exclude 'fr/univnantes/termsuite/test/func/**'
}

task unitTest(type: Test) {
    useJUnitPlatform()
    exclude 'fr/univnantes/termsuite/test/func/**'
}

task cucumberTest(type: Test) {
    useJUnitPlatform()
    include 'fr/univnantes/termsuite/test/func/**'
    exclude 'fr/univnantes/termsuite/test/unit/**'
}

jar {
    manifest { 
        attributes(
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Built-By": System.getProperty('user.name'),
            "Built-Date": new Date(),
            "Built-JDK": System.getProperty('java.version'),
            "Main-Class": "fr.univnantes.termsuite.tools.TerminologyExtractorCLI")
    }
}

compileJava.doFirst {
    // Version check logic simplified or removed if not strictly needed, 
    // or updated to use project.version
}

clean.doLast {
    project.delete (fileTree(dir: 'sources/fr/univnantes/termsuite/types'))
    project.delete (fileTree(dir: 'sources/org'))
}

